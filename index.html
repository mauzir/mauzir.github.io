<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Mały kawałek internetu Mauzira.">
  <title>Mauzir — mój kawałek internetu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f5f3ee;
      color: #22231f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    a {
      color: inherit;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 34px clamp(24px, 7vw, 104px) 24px;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.04em;
      text-decoration: none;
    }

    .github-link {
      font-size: 13px;
      text-decoration-color: #c8c5bc;
      text-underline-offset: 5px;
    }

    main {
      display: grid;
      width: min(100%, 1050px);
      flex: 1;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 8%;
      margin: 0 auto;
      padding: 70px 0;
    }

    .intro {
      padding-bottom: 8px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: #6d6d64;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 570px;
      margin: 0;
      font-size: clamp(54px, 8vw, 100px);
      font-weight: 650;
      letter-spacing: -0.085em;
      line-height: 0.98;
    }

    h1 span {
      color: #d96842;
    }

    .description {
      max-width: 330px;
      margin: 25px 0 30px;
      color: #65655e;
      font-size: 16px;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      gap: 22px;
      padding: 0 18px;
      border-radius: 5px;
      background: #252620;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #414239;
    }

    .button:focus-visible,
    .github-link:focus-visible,
    .wordmark:focus-visible {
      outline: 3px solid #d96842;
      outline-offset: 4px;
    }

    .art {
      position: relative;
      display: grid;
      width: min(100%, 350px);
      aspect-ratio: 1;
      place-items: center;
      justify-self: end;
      overflow: hidden;
      border-radius: 50%;
      background: #e8e5dc;
    }

    .art::before,
    .art::after {
      position: absolute;
      width: 66%;
      aspect-ratio: 1;
      border: 1px solid #c9c5b8;
      border-radius: 50%;
      content: "";
    }

    .art::after {
      width: 88%;
      border-color: #d6d2c7;
    }

    .art-mark {
      z-index: 1;
      margin: -20px 0 0 -4px;
      color: #d96842;
      font-size: clamp(150px, 25vw, 245px);
      font-weight: 700;
      letter-spacing: -0.12em;
      line-height: 1;
    }

    .art-label {
      position: absolute;
      z-index: 2;
      right: 18%;
      bottom: 24%;
      padding: 9px 12px;
      border: 1px solid #d6d2c7;
      border-radius: 99px;
      background: #f5f3ee;
      color: #65655e;
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    footer {
      color: #77776e;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 24px 22px 20px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 46px;
        padding: 78px 0 54px;
      }

      h1 {
        font-size: clamp(58px, 15vw, 88px);
      }

      .art {
        width: min(72vw, 280px);
        justify-self: center;
      }

      .art-mark {
        font-size: clamp(160px, 48vw, 215px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="./" aria-label="Mauzir — strona główna">mauzir.</a>
      <a class="github-link" href="https://github.com/mauzir">GitHub ↗</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">Mój mały kawałek internetu</p>
        <h1 id="intro-title">Cześć,<br>tu Mauzir<span>.</span></h1>
        <p class="description">Robię swoje. Czasem coś z tego zostaje.</p>
        <a class="button" href="https://github.com/mauzir">
          Zajrzyj na GitHuba <span aria-hidden="true">↗</span>
        </a>
      </section>

      <div class="art" aria-hidden="true">
        <span class="art-mark">m.</span>
        <span class="art-label">na swoim</span>
      </div>
    </main>

    <footer>
      <span>Prosto z internetu.</span>
      <span>© Mauzir</span>
    </footer>
  </div>
</body>
</html>
